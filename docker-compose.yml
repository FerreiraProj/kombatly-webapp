services:
  postgres:
    image: postgres:15-alpine
    container_name: taekwombats_postgres
    environment:
      POSTGRES_USER: taekwombats
      POSTGRES_PASSWORD: taekwombats_dev
      POSTGRES_DB: taekwombats
    ports:
      - "5555:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taekwombats"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: taekwombats_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
